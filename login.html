<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT-Indah-lestari - Login System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090a0f',
                        panelbg: '#12141c',
                        cardbg: '#1a1d27',
                        borderbg: '#2a2e3d',
                        brandYellow: '#f59e0b'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #090a0f; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body x-data="{ 
    mode: 'mobile',
    email: '',
    password: '',
    remember: false,
    handleLogin() {
        if (!this.email || !this.password) {
            alert('Silakan isi Email dan Password terlebih dahulu!');
            return;
        }
        alert('Login berhasil sebagai ' + (this.mode === 'mobile' ? 'Owner (Mobile)' : 'Admin (Desktop Filament)'));
        window.location.href = 'demo.html';
    }
}" class="min-h-screen antialiased flex flex-col items-center justify-start p-2 sm:p-6">

    <!-- MODE SWITCHER TOP BAR -->
    <div class="w-full max-w-5xl bg-[#181b26] p-2 rounded-2xl border border-gray-800 flex items-center justify-between mb-6 shadow-xl">
        <div class="flex items-center gap-2 pl-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-xs font-bold text-gray-300">PT-Indah-lestari Login Preview</span>
        </div>
        <div class="flex bg-[#0d0e14] p-1 rounded-xl border border-gray-800">
            <button @click="mode = 'mobile'" :class="mode === 'mobile' ? 'bg-amber-500 text-black font-bold' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-xs transition-all">
                📱 Tampilan owner
            </button>
            <button @click="mode = 'desktop'" :class="mode === 'desktop' ? 'bg-amber-500 text-black font-bold' : 'text-gray-400 hover:text-white'" class="px-3.5 py-1.5 rounded-lg text-xs transition-all">
                💻 tampilan admin
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODE 1: LOGIN MOBILE OWNER VIEW            -->
    <!-- ========================================== -->
    <div x-show="mode === 'mobile'" class="w-full max-w-[390px] bg-black rounded-[40px] border-[8px] border-gray-800 p-6 shadow-2xl relative min-h-[720px] flex flex-col justify-between overflow-hidden">
        
        <!-- Header & Branding -->
        <div class="mt-4 space-y-4">
            <!-- Tombol Kembali Mobile -->
            <a href="index.html" class="inline-flex items-center gap-1.5 text-xs text-gray-400 hover:text-amber-500 transition py-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span>Kembali ke Beranda</span>
            </a>

            <div class="text-center space-y-2 pt-2">
                <div class="w-16 h-16 bg-amber-500/10 border border-amber-500/30 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-amber-500/10">
                    <span class="text-2xl font-extrabold text-amber-500">IL</span>
                </div>
                <h2 class="text-xl font-extrabold text-white tracking-tight">PT-Indah-lestari</h2>
                <p class="text-xs text-gray-400">Owner Mobile Portal Login</p>
            </div>

            <!-- Form Login Mobile -->
            <form @submit.prevent="handleLogin()" class="space-y-4 pt-2">
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1.5">Email Owner</label>
                    <input type="text" x-model="email" placeholder="owner@indah-lestari.com" required 
                        class="w-full bg-[#12141c] border border-gray-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-amber-500 transition">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-medium text-gray-300">Password</label>
                        <a href="#" class="text-[10px] text-amber-500 hover:underline">Lupa Password?</a>
                    </div>
                    <input type="password" x-model="password" placeholder="••••••••" required 
                        class="w-full bg-[#12141c] border border-gray-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-amber-500 transition">
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="rememberMobile" x-model="remember" class="accent-amber-500 rounded border-gray-800">
                    <label for="rememberMobile" class="text-xs text-gray-400 cursor-pointer">Ingat saya di perangkat ini</label>
                </div>

                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-xs py-3 rounded-xl transition shadow-lg shadow-amber-500/10 mt-2">
                    Masuk ke Application
                </button>
            </form>
        </div>

        <!-- Footer Mobile -->
        <div class="text-center pb-2">
            <p class="text-[10px] text-gray-600">© 2026 PT-Indah-lestari. All rights reserved.</p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODE 2: LOGIN DESKTOP FILAMENT VIEW        -->
    <!-- ========================================== -->
    <div x-show="mode === 'desktop'" class="w-full max-w-md bg-[#0d0e14] border border-gray-800 rounded-2xl shadow-2xl p-8 my-auto space-y-6 relative">
        
        <!-- Tombol Kembali Desktop -->
        <div>
            <a href="index.html" class="inline-flex items-center gap-2 text-xs font-semibold text-gray-400 hover:text-amber-500 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span>Kembali ke Beranda Utama</span>
            </a>
        </div>

        <!-- Header Filament Login -->
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-amber-500/10 border border-amber-500/30 rounded-xl flex items-center justify-center mx-auto mb-2">
                <svg class="w-6 h-6 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-xl font-bold text-white tracking-wide">Sign in to Admin Panel</h1>
            <p class="text-xs text-gray-400">Filament v3.x Web Management</p>
        </div>

        <!-- Form Login Desktop -->
        <form @submit.prevent="handleLogin()" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5">Email address <span class="text-amber-500">*</span></label>
                <input type="text" x-model="email" placeholder="admin@indah-lestari.com" required 
                    class="w-full bg-[#12141c] border border-gray-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-amber-500 transition">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-xs font-semibold text-gray-300">Password <span class="text-amber-500">*</span></label>
                    <a href="#" class="text-xs text-amber-500 hover:underline">Forgot password?</a>
                </div>
                <input type="password" x-model="password" placeholder="••••••••" required 
                    class="w-full bg-[#12141c] border border-gray-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-amber-500 transition">
            </div>

            <div class="flex items-center gap-2 pt-1">
                <input type="checkbox" id="rememberDesktop" x-model="remember" class="accent-amber-500 rounded border-gray-800">
                <label for="rememberDesktop" class="text-xs text-gray-400 cursor-pointer">Remember me</label>
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs py-2.5 rounded-xl transition shadow-lg shadow-amber-500/10">
                Sign In
            </button>
        </form>

        <div class="text-center pt-2 border-t border-gray-800/80">
            <p class="text-[11px] text-gray-500">PT-Indah-lestari Filament Admin System</p>
        </div>
    </div>

</body>
</html>
